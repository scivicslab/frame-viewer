quarkus.http.port=28040
quarkus.package.jar.type=uber-jar
quarkus.banner.enabled=false

# Where the frame library and the books' rule files are read from.
frame-viewer.rst-on-lisp-dir=${user.home}/works/rst-on-lisp
frame-viewer.works-dir=${user.home}/works

# The workflows that make frames from books, in the order they run, and where they are read from.
frame-viewer.workflows-dir=${user.home}/works/chat-ui-with-audit-trail/app/src/main/resources/workflows
frame-viewer.workflows=book-toc,book-sections,book-rules,book-concepts,book-judge,book-relations,book-review,book-frame-collect,book-frame-prune,book-frame-items,book-generalize,book-patterns,book-to-rules,concept-tree,abstract-roles,concept-consolidate,make-sample,make-frame,fill-frame

# The H2 database of the intermediate data of making frames from books (book-toc.yaml, book-sections.yaml), without .mv.db.
frame-viewer.books-db=${user.home}/works/rst-on-lisp/db/books
