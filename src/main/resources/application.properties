quarkus.http.port=28040
quarkus.package.jar.type=uber-jar
quarkus.banner.enabled=false

# Where the frame library and the books' rule files are read from.
frame-viewer.rst-on-lisp-dir=${user.home}/works/rst-on-lisp
frame-viewer.works-dir=${user.home}/works

# The workflows that make frames from books, in the order they run, and where they are read from.
frame-viewer.workflows-dir=${user.home}/works/chat-ui-with-audit-trail/app/src/main/resources/workflows
frame-viewer.workflows=book-toc,book-sections,book-to-rules,concept-tree,abstract-roles,concept-consolidate,make-sample,make-frame,fill-frame
